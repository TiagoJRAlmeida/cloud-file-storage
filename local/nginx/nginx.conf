# Rate limiting zones — defined at the top level
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=60r/m;

# HTTP redirection
server {
    listen 80;
    server_name _;

    # Static UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # Health check endpoint - no auth needed
    location /api/health {
        proxy_pass http://api:8000/health;
    }

    # Upload endpoint - strict rate limit
    location /api/files/upload {
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/auth/.htpasswd;

        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass http://api:8000/files/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other API endpoints
    location /api/ {
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/auth/.htpasswd;

        limit_req zone=download_limit burst=20 nodelay;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

