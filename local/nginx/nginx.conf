# Rate limiting zones — defined at the top level
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=60r/m;
client_max_body_size 50M;

server {
    listen 80;
    server_name local-storage-dev.t1gs.com;

    location ~* \.(css|js|ico|png|jpg|svg|woff2?)$ {
        root /usr/share/nginx/html;
        auth_request /oauth2/auth;   # keep protected, or remove if assets can be public
        error_page 401 = /oauth2/start;
    }

    # -------------------------------------------------------
    # OAuth2 internal auth subrequest
    # nginx calls this internally to validate the session
    # -------------------------------------------------------
    location = /oauth2/auth {
        internal;
        proxy_pass              http://oauth2-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Original-URI   $request_uri;
        proxy_set_header        X-Real-IP        $remote_addr;
        proxy_set_header        X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
    }

    # -------------------------------------------------------
    # OAuth2 proxy endpoints (login, callback, sign-out)
    # Must be public — no auth_request here
    # -------------------------------------------------------
    location /oauth2/ {
        proxy_pass              http://oauth2-proxy:4180;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        X-Forwarded-Host  $host;
    }

    # -------------------------------------------------------
    # Static UI — protected
    # -------------------------------------------------------
    location /home {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/start;

        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # Redirect root to /home for convenience
    location = / {
        return 302 /home;
    }

    # -------------------------------------------------------
    # Health check — public, no auth needed
    # -------------------------------------------------------
    location = /api/health {
        proxy_pass http://api:8000/health;
    }

    # -------------------------------------------------------
    # Upload endpoint — protected + strict rate limit
    # -------------------------------------------------------
    location /api/files/upload {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/start;

        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass       http://api:8000/files/upload;
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
    }

    # -------------------------------------------------------
    # All other API endpoints — protected + rate limit
    # -------------------------------------------------------
    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/start;

        limit_req zone=download_limit burst=20 nodelay;

        proxy_pass       http://api:8000/;
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
    }
}