apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: nginx
data:
  nginx.conf: |
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /health {
            proxy_pass http://api-service.app.svc.cluster.local:8000/health;
        }

        location /metrics {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://localhost:9113/metrics;
        }

        location /files/upload {
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;
            limit_req zone=upload_limit burst=5 nodelay;
            proxy_pass http://api-service.app.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;
            limit_req zone=download_limit burst=20 nodelay;
            proxy_pass http://api-service.app.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }