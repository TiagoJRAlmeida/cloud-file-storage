apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-prometheusrule
  namespace: api
  labels:
    app.kubernetes.io/part-of: api
spec:
  groups:
    - name: api
      rules:
        - alert: APIHighErrorRate
          expr: |
            rate(http_requests_total{namespace="api", status=~"5.."}[5m])
            /
            rate(http_requests_total{namespace="api"}[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "API error rate above 5%"

        - alert: APIHighLatency
          expr: |
            histogram_quantile(0.95,
              rate(http_request_duration_seconds_bucket{namespace="api"}[5m])
            ) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "API P95 latency above 2s"

        - alert: APIHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="api", container="api"}[5m]) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API pod CPU above 80%"