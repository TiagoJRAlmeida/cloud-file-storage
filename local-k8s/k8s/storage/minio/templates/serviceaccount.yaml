apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.fullname }}-service-account"
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: minio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Values.fullname }}-role"
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: minio
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Values.fullname }}-rolebinding"
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: minio
subjects:
  - kind: ServiceAccount
    name: "{{ .Values.fullname }}-service-account"
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: "{{ .Values.fullname }}-role"
  apiGroup: rbac.authorization.k8s.io