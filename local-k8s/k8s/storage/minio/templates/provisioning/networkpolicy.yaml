{{- if and .Values.provisioning.enabled .Values.provisioning.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ .Values.fullname }}-provisioning-netpol"
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: provisioning
    app.kubernetes.io/part-of: minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: provisioning
      app.kubernetes.io/part-of: minio
  policyTypes:
    - Ingress
    - Egress
  # no incoming traffic allowed
  ingress: []
  egress:
    # Allow dns resolution
    - ports:
        - port: 53
          protocol: UDP
    # Allow outbound connections to other cluster pods
    - ports:
        - port: {{ .Values.service.ports.api }}
      to:
        - podSelector:
            matchLabels: 
              app: {{ .Values.fullname }}  # only talk to MinIO
{{- end }}
